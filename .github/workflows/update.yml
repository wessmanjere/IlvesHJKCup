name: Päivitä pelitiedot

on:
  schedule:
    # 5 minuutin valein. Tama on GitHubin lyhyin sallittu cron-vali; GitHub voi
    # viivastyttaa ajoa ruuhka-aikoina.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scraper/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-games
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Asenna riippuvuudet
        run: pip install -r scraper/requirements.txt

      - name: Hae pelit
        run: python scraper/fetch_games.py

      - name: Committaa muutokset
        run: |
          set -u
          if [ -z "$(git status --porcelain docs/data/games.json)" ]; then
            echo "Ei muutoksia pelitiedoissa."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/games.json
          git commit -q -m "Päivitä pelitiedot $(date -u '+%Y-%m-%d %H:%M UTC')"

          for attempt in 1 2 3; do
            if git pull --rebase --autostash -q origin "$GITHUB_REF_NAME" && git push -q; then
              echo "Muutokset pushattu."
              exit 0
            fi
            echo "Push epaonnistui (yritys $attempt), yritetaan uudelleen."
            sleep 5
          done

          echo "Pushia ei saatu lapi, seuraava ajo yrittaa uudelleen."
